<body>
    <div class="bg-container" id="bgContainer"></div>

<div class="links">

    <!-- Instagram -->
    <div class="link-wrapper">
        <a href="https://www.instagram.com/cs_store74?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" class="link-item" target="_blank" rel="noopener">

    <!-- TikTok -->

    <!-- WhatsApp Dodo -->
    <div class="link-wrapper">
        <a href="https://wa.me/+6282152732809/" class="link-item" target="_blank" rel="noopener">

        <div class="action-menu">

</div>


    <script>
        const backgrounds = [
            'backgrounds/bg1.jpg',
            'backgrounds/bg2.jpg',
            'backgrounds/bg3.jpg',
            'backgrounds/bg4.jpg',
        ];

        let currentBgIndex = 0;
        const bgContainer = document.getElementById('bgContainer');

        setInterval(() => {
            currentBgIndex = (currentBgIndex + 1) % backgrounds.length;
            bgContainer.style.backgroundImage = `url(${backgrounds[currentBgIndex]})`;
        }, 6000);

        bgContainer.style.backgroundImage = `url(${backgrounds[0]})`;

        // Auto open links

document.addEventListener('DOMContentLoaded', function () {

    const wrappers = document.querySelectorAll('.link-wrapper');

    wrappers.forEach(wrapper => {

        const moreBtn = wrapper.querySelector('.more-btn');
        const menu = wrapper.querySelector('.action-menu');
        const link = wrapper.querySelector('.link-item');

        if (!moreBtn || !menu || !link) return;

        // Klik titik tiga
        moreBtn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();

            const isOpen = menu.classList.contains('show');

            // Tutup semua menu
            document.querySelectorAll('.action-menu').forEach(item => {
                item.classList.remove('show');
            });

            // Buka menu yang dipilih
            if (!isOpen) {
                menu.classList.add('show');
            }
        });

        // Salin link
        wrapper.querySelector('.copy-btn').addEventListener('click', async function (e) {
            e.preventDefault();
            e.stopPropagation();

            try {
                await navigator.clipboard.writeText(link.href);
                alert('Link berhasil disalin!');
            } catch (error) {
                const temp = document.createElement('textarea');
                temp.value = link.href;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                temp.remove();
                alert('Link berhasil disalin!');
            }

            menu.classList.remove('show');
        });

        // Share
        wrapper.querySelector('.share-btn').addEventListener('click', async function (e) {
            e.preventDefault();
            e.stopPropagation();

            try {
                if (navigator.share) {
                    await navigator.share({
                        title: 'CS STORE',
                        text: 'Kunjungi CS STORE!',
                        url: link.href
                    });
                } else {
                    await navigator.clipboard.writeText(link.href);
                    alert('Link berhasil disalin!');
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    alert('Gagal membagikan link.');
                }
            }

            menu.classList.remove('show');
        });

    });

    // Klik di luar menu untuk menutup
    document.addEventListener('click', function () {
        document.querySelectorAll('.action-menu').forEach(menu => {
            menu.classList.remove('show');
        });
    });

});

        
        // Tutup menu ketika klik di luar
        document.addEventListener('click', () => {
            document.querySelectorAll('.action-menu').forEach(menu => {
                menu.classList.remove('show');
            });
        });
        window.addEventListener('scroll', () => {
            const scrolled = window.pageYOffset;
            const parallax = document.querySelector('.bg-container');
            parallax.style.transform = `translateY(${scrolled * 0.5}px) scale(1.05)`;
        });
    </script>
</body>
</html>
